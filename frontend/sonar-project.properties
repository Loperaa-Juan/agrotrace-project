sonar.projectKey=frontend

# Código fuente y pruebas
sonar.sources=src
sonar.tests=test
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# Reporte de cobertura generado por `pnpm test:coverage`
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# El punto de entrada no aporta lógica a cubrir
sonar.coverage.exclusions=src/main.tsx
