[project]
name = "ai-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.120",
    "fastapi[standard]>=0.161.1",
    "onnxruntime>=1.31.0",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.1",
    "pysonar>=1.10.0.5888",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "python-magic>=0.4.27",
    "python-magic-bin>=0.4.14 ; sys_platform == 'win32'",
    "ultralytics>=8.4.184",
]
[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
