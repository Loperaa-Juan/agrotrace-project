# Configuración del Servidor
sonar.host.url=http://localhost:9000
# Token leído de la variable de entorno SONAR_TOKEN (no subirlo al repo)
sonar.token=${env.SONAR_TOKEN}

# Identificación del Proyecto
sonar.projectKey=ai-service
sonar.projectName=AI Service
sonar.projectVersion=1.0


# Configuración de Código
sonar.sources=src
sonar.language=py
sonar.sourceEncoding=UTF-8

# Reporte de Cobertura
sonar.python.coverage.reportPaths=coverage.xml

# Tests
sonar.tests=tests

# Exclusiones (Opcional pero recomendado)
# Evita que Sonar analice tus tests o entornos virtuales como código fuente
sonar.exclusions=**/venv/**, **/tests/**, **/setup.py