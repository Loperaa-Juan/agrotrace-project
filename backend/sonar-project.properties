sonar.projectKey=backend-agrotrace

# Código fuente y pruebas (viven en las mismas carpetas)
sonar.sources=apps
sonar.tests=apps
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts
sonar.exclusions=**/*.spec.ts,**/*.e2e-spec.ts

# Reporte de cobertura generado por `pnpm test:cov`
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Arranque y módulos de Nest no aportan lógica a cubrir
sonar.coverage.exclusions=**/main.ts,**/*.module.ts
