services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME:-agrotrace}
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  users:
    build:
      context: ./backend/
      args:
        APP: users-service
    env_file: ./backend/apps/users-service/.env
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  catalog:
    build:
      context: ./backend/
      args:
        APP: catalog-service
    env_file: ./backend/apps/catalog-service/.env
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      USERS_SERVICE_HOST: users
      USERS_SERVICE_PORT: 3001
      AI_SERVICE_URL: http://ai:8000
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      users:
        condition: service_started
      ai:
        condition: service_started
    restart: unless-stopped

  orders:
    build:
      context: ./backend/
      args:
        APP: orders-service
    env_file: ./backend/apps/orders-service/.env
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      USERS_SERVICE_HOST: users
      USERS_SERVICE_PORT: 3001
      CATALOG_SERVICE_HOST: catalog
      CATALOG_SERVICE_PORT: 3003
    ports:
      - "3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
      users:
        condition: service_started
      catalog:
        condition: service_started
    restart: unless-stopped

  ai:
    build: ./ai-service/
    env_file: ./ai-service/.env
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/
      args:
        # El navegador llama a los servicios desde el host, no desde la red de docker
        VITE_USERS_API_URL: ${VITE_USERS_API_URL:-http://localhost:3000}
        VITE_CATALOG_API_URL: ${VITE_CATALOG_API_URL:-http://localhost:3002}
        VITE_ORDERS_API_URL: ${VITE_ORDERS_API_URL:-http://localhost:3004}
    ports:
      - "5173:80"
    depends_on:
      - users
      - catalog
      - orders
    restart: unless-stopped

volumes:
  postgres-data:
